name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q CatPet.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: CatPet
      - run: gh release create apk-${{ github.run_number }} CatPet/app/build/outputs/apk/debug/app-debug.apk --title "Котик ${{ github.run_number }}"
        env:
          GH_TOKEN: ${{ github.token }}
